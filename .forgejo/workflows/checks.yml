name: checks

on:
  push:
    branches:
      - main
  pull_request:

# Opt out of Turborepo and Wrangler telemetry. `turbo telemetry disable` only
# affects the machine it's run on, so CI has to opt out via the environment.
env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  WRANGLER_SEND_METRICS: false
  # Turborepo remote cache (apps/turbo-cache), shared by PR and main runs so a
  # build cached on a PR is replayed after merge instead of rebuilt. Without a
  # token (e.g. fork PRs) turbo quietly falls back to building locally.
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  checks:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turborepo's local cache, carried between runs. A new entry is saved per
      # commit; restores fall back to the most recent one for this workflow.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ github.workflow }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.workflow }}-

      # Lints, format-checks and typechecks in parallel, skipping any task whose
      # inputs haven't changed since a cached run; --continue reports every
      # failure instead of stopping at the first.
      - run: pnpm turbo run oxlint oxfmt:check typecheck --continue
