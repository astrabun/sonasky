name: checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turborepo's local cache, carried between runs. A new entry is saved per
      # commit; restores fall back to the most recent one for this workflow.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ github.workflow }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.workflow }}-

      # Lints, format-checks and typechecks in parallel, skipping any task whose
      # inputs haven't changed since a cached run; --continue reports every
      # failure instead of stopping at the first.
      - run: pnpm turbo run oxlint oxfmt:check typecheck --continue
