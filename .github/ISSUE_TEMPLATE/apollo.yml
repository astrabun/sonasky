name: "\U0001F680 SonaSky Apollo issue"
description: Report a bug or request a feature for SonaSky Apollo (apollo.sonasky.app).
title: "[Apollo]: "
labels:
  - apollo
body:
  - type: markdown
    attributes:
      value: |
        Use this for problems with, or feature requests for, `apps/apollo` (apollo.sonasky.app): the site editor, templates/themes/blocks, publishing, or how sites are served.

        **To report someone's site content, use the Report button in the top bar of that site, not a GitHub issue.** Security issues should not be filed publicly here either.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor / block builder
        - Templates, themes or blocks
        - Markdown / HTML / CSS / JS pages
        - Viewing a published site
        - Sign-in / OAuth
        - Media / uploads
        - Links / leaving-site interstitial
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: request-type
    attributes:
      label: Request type
      options:
        - Bug
        - Feature request
        - New template/theme/block idea
        - Other
    validations:
      required: true

  - type: input
    id: site-url
    attributes:
      label: Site URL
      description: The affected site, if any.
      placeholder: e.g. https://apollo.sonasky.app/@alice.example/about
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: Details
      description: |
        - If a bug: what did you do, what happened, what did you expect?
        - If a feature request: what do you want, and why?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links, browser/device info, etc.
    validations:
      required: false
