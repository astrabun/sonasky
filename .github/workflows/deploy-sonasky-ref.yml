name: Deploy SonaSky REF

on:
  push:
    branches: ["main"]
    paths:
      - "apps/sonasky-ref/**"
      - "packages/tsconfig/**"
      - ".github/workflows/deploy-sonasky-ref.yml"
  pull_request:
    paths:
      - "apps/sonasky-ref/**"
      - "packages/tsconfig/**"
      - ".github/workflows/deploy-sonasky-ref.yml"

concurrency:
  group: deploy-sonasky-ref-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -F @sonasky/app-sonasky-ref build
        env:
          SWETRIX_BASE_URL: ${{ vars.SWETRIX_BASE_URL || secrets.SWETRIX_BASE_URL }}
          # SonaSky REF-specific project so its pageviews don't land in other apps'.
          SWETRIX_PROJECT_ID: ${{ vars.SWETRIX_SONASKY_REF_PROJECT_ID || secrets.SWETRIX_SONASKY_REF_PROJECT_ID }}

      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy apps/sonasky-ref/dist
            --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME_SONASKY_REF }}
            --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}

      - id: timestamp
        if: github.event_name == 'pull_request'
        run: echo "time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Update sticky preview status comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: sonasky-ref-preview
          message: |
            ### SonaSky REF preview
            ✅ Last successful build: `${{ github.event.pull_request.head.sha }}` at ${{ steps.timestamp.outputs.time }}
            Preview: ${{ steps.deploy.outputs.deployment-alias-url }}

      - name: Comment on commit build
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🚀 Preview build for `${{ github.event.pull_request.head.sha }}` succeeded: ${{ steps.deploy.outputs.deployment-url }}
