name: Stale issues

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 14
          exempt-issue-labels: good-first-issue,pinned,security
          exempt-pr-labels: pinned,security
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue hasn't had any activity in 30 days. It will be closed in 14 days
            if no further activity occurs. Remove the `stale` label or comment to keep it open.
          stale-pr-message: >
            This pull request hasn't had any activity in 30 days. It will be closed in 14 days
            if no further activity occurs. Remove the `stale` label or comment to keep it open.
          close-issue-message: >
            Closing this issue due to inactivity. Feel free to reopen if it's still relevant.
          close-pr-message: >
            Closing this pull request due to inactivity. Feel free to reopen if it's still relevant.
