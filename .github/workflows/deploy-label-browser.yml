name: Deploy Label Browser

on:
  push:
    branches: ["main"]
    paths:
      - "apps/label-browser/**"
      - "packages/labels-def/**"
      - "packages/tsconfig/**"
      - ".github/workflows/deploy-label-browser.yml"
  pull_request:
    paths:
      - "apps/label-browser/**"
      - "packages/labels-def/**"
      - "packages/tsconfig/**"
      - ".github/workflows/deploy-label-browser.yml"

concurrency:
  group: deploy-label-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -F @sonasky/app-label-browser build

      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/label-browser/dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}

      - id: timestamp
        if: github.event_name == 'pull_request'
        run: echo "time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Update sticky preview status comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: label-browser-preview
          message: |
            ### Label browser preview
            ✅ Last successful build: `${{ github.event.pull_request.head.sha }}` at ${{ steps.timestamp.outputs.time }}
            Preview: ${{ steps.deploy.outputs.deployment-alias-url }}

      - name: Comment on commit build
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🚀 Preview build for `${{ github.event.pull_request.head.sha }}` succeeded: ${{ steps.deploy.outputs.deployment-url }}
