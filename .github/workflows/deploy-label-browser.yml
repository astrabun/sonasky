name: Deploy Label Browser

on:
  push:
    branches: ["main"]
    paths:
      - "apps/label-browser/**"
      - "packages/labels-def/**"
      - "packages/tsconfig/**"
      - ".github/workflows/deploy-label-browser.yml"
  pull_request:
    paths:
      - "apps/label-browser/**"
      - "packages/labels-def/**"
      - "packages/tsconfig/**"
      - ".github/workflows/deploy-label-browser.yml"

concurrency:
  group: deploy-label-browser-${{ github.ref }}
  cancel-in-progress: true

# Opt out of Turborepo and Wrangler telemetry. `turbo telemetry disable` only
# affects the machine it's run on, so CI has to opt out via the environment.
env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  WRANGLER_SEND_METRICS: false
  # Turborepo remote cache (apps/turbo-cache), shared by PR and main runs so a
  # build cached on a PR is replayed after merge instead of rebuilt. Without a
  # token (e.g. fork PRs) turbo quietly falls back to building locally.
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build --filter=@sonasky/app-label-browser
        env:
          SWETRIX_BASE_URL: ${{ vars.SWETRIX_BASE_URL || secrets.SWETRIX_BASE_URL }}
          SWETRIX_PROJECT_ID: ${{ vars.SWETRIX_PROJECT_ID || secrets.SWETRIX_PROJECT_ID }}

      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy apps/label-browser/dist
            --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
            --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}

      - id: timestamp
        if: github.event_name == 'pull_request'
        run: echo "time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Update sticky preview status comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: label-browser-preview
          message: |
            ### Label browser preview
            ✅ Last successful build: `${{ github.event.pull_request.head.sha }}` at ${{ steps.timestamp.outputs.time }}
            Preview: ${{ steps.deploy.outputs.deployment-alias-url }}

      - name: Comment on commit build
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🚀 Preview build for `${{ github.event.pull_request.head.sha }}` succeeded: ${{ steps.deploy.outputs.deployment-url }}
