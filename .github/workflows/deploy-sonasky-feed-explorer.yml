name: Deploy SonaSky Feed Explorer

on:
  push:
    branches: ["main"]
    paths:
      - "apps/sonasky-feed-explorer/**"
      - "packages/tsconfig/**"
      - ".github/workflows/deploy-sonasky-feed-explorer.yml"
  pull_request:
    paths:
      - "apps/sonasky-feed-explorer/**"
      - "packages/tsconfig/**"
      - ".github/workflows/deploy-sonasky-feed-explorer.yml"

concurrency:
  group: deploy-sonasky-feed-explorer-${{ github.ref }}
  cancel-in-progress: true

# Opt out of Turborepo and Wrangler telemetry. `turbo telemetry disable` only
# affects the machine it's run on, so CI has to opt out via the environment.
env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  WRANGLER_SEND_METRICS: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turborepo's local cache, carried between runs. A new entry is saved per
      # commit; restores fall back to the most recent one for this workflow.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ github.workflow }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.workflow }}-

      - run: pnpm turbo run build --filter=@sonasky/app-sonasky-feed-explorer
        env:
          VITE_FEED_GENERATOR_URL: https://feeds.sonasky.app

      # PRs only validate the bundle; pushes to main deploy for real. This
      # Worker holds the /debug/explorer route on sonasky.app in front of the
      # label-browser Pages project, so it deploys independently of it.
      - name: Validate bundle (PR)
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/sonasky-feed-explorer
          command: deploy --dry-run

      - name: Deploy (main)
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/sonasky-feed-explorer
          command: deploy
