name: Deploy SonaSky REF OG Data

on:
  push:
    branches: ["main"]
    paths:
      - "apps/sonasky-ref-og-data/**"
      - "packages/tsconfig/**"
      - ".github/workflows/deploy-sonasky-ref-og-data.yml"
  pull_request:
    paths:
      - "apps/sonasky-ref-og-data/**"
      - "packages/tsconfig/**"
      - ".github/workflows/deploy-sonasky-ref-og-data.yml"

concurrency:
  group: deploy-sonasky-ref-og-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -F @sonasky/app-sonasky-ref-og-data typecheck

      # PRs only validate the bundle; pushes to main deploy for real. This
      # Worker holds the /profile/* route on ref.sonasky.app in front of the
      # sonasky-ref Pages project, so it deploys independently of it.
      - name: Validate bundle (PR)
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/sonasky-ref-og-data
          command: deploy --dry-run

      - name: Deploy (main)
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/sonasky-ref-og-data
          command: deploy
