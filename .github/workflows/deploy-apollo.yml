name: Deploy Apollo

on:
  push:
    branches: ["main"]
    paths:
      - "apps/apollo/**"
      - "packages/tsconfig/**"
      - "packages/labels-def/**"
      - "packages/apollo-themes/**"
      - ".github/workflows/deploy-apollo.yml"
  pull_request:
    paths:
      - "apps/apollo/**"
      - "packages/tsconfig/**"
      - "packages/labels-def/**"
      - "packages/apollo-themes/**"
      - ".github/workflows/deploy-apollo.yml"

concurrency:
  group: deploy-apollo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turborepo's local cache, carried between runs. A new entry is saved per
      # commit; restores fall back to the most recent one for this workflow.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ github.workflow }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.workflow }}-

      - run: pnpm turbo run test --filter=@sonasky/app-apollo

      - run: pnpm turbo run build --filter=@sonasky/app-apollo

      # PRs only validate the bundle; pushes to main deploy for real.
      - name: Validate bundle (PR)
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/apollo
          command: deploy --dry-run

      # Opt-in until the KV namespaces, secrets and usercontent domain exist
      # (see apps/apollo/README.md "First deploy"). Set the repo variable
      # APOLLO_DEPLOY_ENABLED=true to turn on deploys from main.
      - name: Deploy (main)
        if: github.event_name == 'push' && vars.APOLLO_DEPLOY_ENABLED == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/apollo
          command: deploy
