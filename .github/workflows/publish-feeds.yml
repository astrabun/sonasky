name: Publish feed generator records

on:
  push:
    branches: ["main"]
    paths:
      - "packages/labels-def/**"
      - "apps/feed-generator/**"
      - ".github/workflows/publish-feeds.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SERVICE_HOSTNAME: feeds.sonasky.app
      SONASKY_BSKY_USER: ${{ secrets.SONASKY_BSKY_USER }}
      SONASKY_BSKY_PASS: ${{ secrets.SONASKY_BSKY_PASS }}
      # Optional - the test-destination publish step below skips cleanly if these aren't set.
      TEST_BSKY_USER: ${{ secrets.TEST_BSKY_USER }}
      TEST_BSKY_PASS: ${{ secrets.TEST_BSKY_PASS }}
      TEST_SONASKY_DID: ${{ secrets.TEST_SONASKY_DID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm feed-generator:publish
      - run: pnpm feed-generator:publish-test
      - run: pnpm feed-generator:unpublish
      - run: pnpm feed-generator:unpublish-test
