# Local dev only. docker-compose.yml is written for the self-contained prod
# stack, where feed-generator itself also runs in a container on the same
# internal network, so postgres/redis aren't published to the host. This
# override (auto-merged by `docker compose up`) publishes them to loopback
# only, so a locally-run `pnpm feed-generator:start`/`:migrate` (not in
# Docker) can reach them via localhost - safe to leave in place even on a
# prod host, since it never binds beyond 127.0.0.1.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"
