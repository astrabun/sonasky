services:
  feed-generator:
    build:
      context: ../..
      dockerfile: apps/feed-generator/Dockerfile
    # SERVICE_HOSTNAME, SONASKY_BSKY_*, {REALM}_OZONE_SERVICE_USER_DID come from .env.
    # These are fixed by the compose topology and override .env deliberately.
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://feeds:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/feeds
      PORT: "8080"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - feed-generator
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: feeds
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: feeds
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feeds"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
